<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="reign-icon-192.png">
<link rel="apple-touch-icon" href="reign-icon-192.png">
<title>REIGN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --card:#141414;
    --card-2:#1c1c1c;
    --line:#303030;
    --white:#ffffff;
    --ink:#f5f5f5;
    --ink-dim:#9a9a9a;
    --ink-faint:#5c5c5c;
    --shadow: 0 2px 4px rgba(0,0,0,0.5), 0 16px 40px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.016) 0px, rgba(255,255,255,0.016) 1px, transparent 1px, transparent 34px);
    color:var(--ink);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
    padding:18px 16px 40px;
    overflow-x:hidden;
    -webkit-user-select:none; user-select:none;
  }
  input, textarea{ -webkit-user-select:text; user-select:text; }
  .wrap{max-width:820px; margin:0 auto;}

  /* Top bar (in-app, not browser) */
  .app-top{display:flex; align-items:center; justify-content:space-between; padding:4px 2px 14px;}
  .app-brand{display:flex; align-items:center; gap:10px;}
  .app-brand img{width:34px; height:34px; border-radius:9px; object-fit:cover; border:1px solid var(--line);}
  .app-brand span{font-family:'Cinzel', serif; font-weight:700; letter-spacing:.15em; font-size:16px; color:var(--white);}
  .menu-btn{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    font-size:18px; color:var(--ink); cursor:pointer; position:relative;
  }
  .menu-dropdown{
    position:absolute; top:46px; left:0; background:var(--card-2); border:1px solid var(--line);
    border-radius:14px; box-shadow:var(--shadow); min-width:180px; z-index:40; overflow:hidden; display:none;
  }
  .menu-dropdown.open{display:block;}
  .menu-item{
    padding:13px 15px; font-size:13.5px; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; gap:9px; border-bottom:1px solid var(--line);
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item:active{background:var(--card);}

  /* Header / name card */
  .head-card{
    position:relative;
    background:linear-gradient(160deg, var(--card-2), var(--card));
    border:1px solid var(--line);
    border-radius:22px;
    padding:26px 26px 22px;
    box-shadow:var(--shadow);
    overflow:hidden;
    text-align:center;
  }
  .head-card::after{
    content:""; position:absolute; top:0; right:0; left:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--white), transparent);
  }
  .head-logo{width:64px; height:64px; border-radius:50%; object-fit:cover; margin:0 auto 12px; border:1px solid var(--line); display:block;}
  .discipline-title{
    font-family:'Cinzel', serif;
    font-size:38px; font-weight:700; letter-spacing:0.18em;
    color:var(--white);
  }
  .discipline-sub{font-size:10.5px; letter-spacing:.3em; color:var(--ink-faint); margin-top:4px; text-transform:uppercase;}

  .id-row{display:flex; align-items:baseline; gap:8px; justify-content:center; margin-top:18px;}
  .id-label{font-size:10.5px; letter-spacing:.08em; color:var(--ink-faint); font-weight:700; white-space:nowrap;}
  .id-row input{
    background:none; border:none; border-bottom:1px solid var(--line);
    color:var(--ink); font-family:inherit; font-size:14px; font-weight:600;
    padding:2px 4px; text-align:center; width:140px;
  }
  .id-row input:focus{outline:none; border-bottom-color:var(--white);}
  .id-row2{margin-top:8px; font-size:12.5px; font-weight:700; color:var(--white);}

  .section-title{
    font-size:12.5px; font-weight:800; color:var(--white);
    margin:24px 3px 10px; display:flex; align-items:center; gap:10px; letter-spacing:.03em;
  }
  .section-title::after{content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--line), transparent);}

  /* Goals */
  .goals-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:10px;}
  .goal-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 15px; box-shadow:var(--shadow); position:relative;
  }
  .goal-card::before{
    content:""; position:absolute; top:0; bottom:0; right:0; width:3px;
    background:var(--white); border-radius:0 16px 16px 0; opacity:.5;
  }
  .goal-tag{
    font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:20px;
    background:var(--card-2); color:var(--white); letter-spacing:.02em; border:1px solid var(--line);
    display:inline-block; margin-bottom:8px;
  }
  .goal-text{
    font-size:14px; font-weight:500; color:var(--ink); line-height:1.6;
    background:none; border:none; width:100%; font-family:inherit; resize:none; padding:0; min-height:42px;
  }
  .goal-text:focus{outline:none;}
  .goal-text::placeholder{color:var(--ink-faint);}

  /* Add task pill */
  .add-pill-row{display:flex; justify-content:flex-end; margin-bottom:2px;}
  .add-pill{
    display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:8px 14px; font-size:12.5px; color:var(--ink-dim); cursor:pointer;
  }
  .add-pill:active{background:var(--card-2);}
  .add-form{
    display:none; background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:13px 14px; box-shadow:var(--shadow); margin-bottom:12px;
  }
  .add-form.open{display:block;}
  .add-row{display:flex; gap:9px;}
  .add-row input.emoji-input{width:46px; text-align:center; font-size:18px; flex:0 0 auto;}
  .add-row input{
    border:1px solid var(--line); border-radius:11px; padding:11px 13px;
    font-family:inherit; font-size:14px; background:var(--card-2); color:var(--ink);
  }
  .add-row input[type=text]{flex:1;}
  .add-row input:focus{outline:2px solid var(--white); outline-offset:1px;}
  .add-row button{
    border:none; background:var(--white); color:#000;
    border-radius:11px; padding:0 18px; font-family:inherit; font-weight:800; font-size:14px; cursor:pointer;
  }
  .quick-chips{display:flex; gap:8px; margin-top:10px;}
  .quick-chip{
    display:flex; align-items:center; gap:6px; background:var(--card-2); border:1px dashed var(--line);
    border-radius:20px; padding:7px 12px; font-size:12px; color:var(--ink-dim); cursor:pointer;
  }
  .spin-dot{
    width:11px; height:11px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--white);
    animation:spin 0.9s linear infinite; flex:0 0 auto;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Tasks */
  .task{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:15px 16px; margin-bottom:11px; box-shadow:var(--shadow);
  }
  .task-head{display:flex; align-items:center; gap:12px;}
  @keyframes floatEmoji{
    0%,100%{ transform:translateY(0) rotate(-3deg); }
    50%{ transform:translateY(-5px) rotate(4deg); }
  }
  .emoji-btn{
    width:42px; height:42px; border-radius:12px; background:var(--card-2);
    border:1px solid var(--line); font-size:20px; display:flex; align-items:center;
    justify-content:center; flex:0 0 auto; cursor:pointer;
    animation:floatEmoji 2.6s ease-in-out infinite;
  }
  .task-label{
    flex:1; font-size:15px; font-weight:600; color:var(--ink);
    background:none; border:none; font-family:inherit; padding:0; width:100%;
  }
  .task-label:focus{outline:none; color:var(--white);}
  .icon-btn{
    background:var(--card-2); border:1px solid var(--line); border-radius:10px; font-size:15px;
    cursor:pointer; flex:0 0 auto; padding:6px 9px; color:var(--ink-dim);
  }

  .tick-grid{display:flex; flex-wrap:nowrap; gap:6px; margin-top:14px; overflow-x:auto;}
  .tick-box{
    flex:0 0 auto; width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:var(--card-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px;
    color:var(--ink-faint); transition:all .12s ease; user-select:none;
  }
  .tick-box.on{background:var(--white); border-color:var(--white); color:#000; font-weight:800;}
  .tick-box.on.locked{cursor:not-allowed; opacity:.85;}
  .tick-box.locked{cursor:not-allowed; opacity:.35;}
  .tick-box.waiting{cursor:not-allowed; opacity:.55; border-style:dashed;}
  .tick-box.next-open{border-color:var(--white); box-shadow:0 0 0 2px rgba(255,255,255,0.15); animation:pulseNext 1.6s ease-in-out infinite;}
  @keyframes pulseNext{
    0%,100%{ box-shadow:0 0 0 2px rgba(255,255,255,0.12); }
    50%{ box-shadow:0 0 0 4px rgba(255,255,255,0.3); }
  }
  @keyframes shakeBox{
    0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-3px); } 75%{ transform:translateX(3px); }
  }
  .tick-box.shake{animation:shakeBox .3s ease;}
  .tick-wait{font-size:11px; color:var(--ink-faint); margin-top:8px;}
  .tick-footer{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
  .tick-count{font-size:11.5px; color:var(--ink-faint);}
  .pct-badge{font-size:14px; font-weight:900; color:#000; background:var(--white); padding:4px 13px; border-radius:20px;}

  .photo-row{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .photo-btn{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-dim);
    background:var(--card-2); border:1px dashed var(--line); border-radius:10px; padding:7px 11px; cursor:pointer;
  }
  .photo-thumb{width:46px; height:46px; border-radius:10px; object-fit:cover; border:1px solid var(--line); cursor:pointer;}

  .footer-tag{
    text-align:center; margin-top:30px; padding-top:16px; border-top:1px solid var(--line);
  }
  .footer-tag .brand{
    font-family:'Cinzel', serif; font-size:13px; letter-spacing:.25em; color:var(--ink-dim);
  }
  .footer-tag .credit{font-size:10px; color:var(--ink-faint); margin-top:4px;}

  .lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none;
    align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%; max-height:85vh; border-radius:16px; box-shadow:var(--shadow);}

  .page-overlay{
    position:fixed; inset:0; background:var(--bg); z-index:60; display:none;
    overflow-y:auto; padding:18px 16px 40px;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.016) 0px, rgba(255,255,255,0.016) 1px, transparent 1px, transparent 34px);
  }
  .page-overlay.open{display:block;}
  .page-top{display:flex; align-items:center; gap:10px; margin-bottom:18px; max-width:820px; margin-left:auto; margin-right:auto;}
  .page-back{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:9px 14px; font-family:inherit; font-size:13px; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .page-brand{font-family:'Cinzel', serif; letter-spacing:.15em; font-size:14px; color:var(--white);}
  .page-content{max-width:820px; margin:0 auto;}
  .modal-title{font-family:'Cinzel', serif; letter-spacing:.1em; font-size:17px; color:var(--white); margin-bottom:14px;}
  .modal-close{
    display:block; margin:16px auto 0; background:var(--card-2); border:1px solid var(--line); color:var(--ink);
    border-radius:12px; padding:9px 24px; font-family:inherit; font-size:13px; cursor:pointer;
  }
  .stat-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line);}
  .stat-row:last-child{border-bottom:none;}
  .stat-label{font-size:13px; color:var(--ink-dim);}
  .stat-value{font-size:17px; font-weight:800; color:var(--white);}
  .about-text{font-size:13.5px; line-height:2; color:var(--ink-dim);}
  .about-text b{color:var(--ink);}

  .loading{text-align:center; padding:50px; color:var(--ink-faint); font-size:14px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="app-top">
    <div class="app-brand">
      <span>REIGN</span>
    </div>
    <div class="menu-btn" id="menuBtn">⋮
      <div class="menu-dropdown" id="menuDropdown">
        <div class="menu-item" id="homeBtn">📅 تسک هفتگی</div>
        <div class="menu-item" id="studyTaskBtn">📚 تسک درس</div>
        <div class="menu-item" id="financeTaskBtn">💰 تسک مالی</div>
        <div class="menu-item" id="statsBtn">📊 آمار نظم</div>
        <div class="menu-item" id="goalsMenuBtn">🎯 هدف‌ها</div>
        <div class="menu-item" id="aboutBtn">ℹ️ درباره برنامه</div>
      </div>
    </div>
  </div>

  <div class="head-card">
    <img class="head-logo" src="reign-logo.png" alt="REIGN">
    <div class="discipline-title">DISCIPLINE</div>
    <div class="discipline-sub">Reign Over Yourself</div>
    <div class="id-row">
      <span class="id-label">NAME</span>
      <input id="nameInput" placeholder="اسمت...">
    </div>
    <div class="id-row2" id="dateStatic">—</div>
  </div>

  <div class="section-title">✅ تسک‌ها — هفتگی</div>
  <div class="add-pill-row">
    <div class="add-pill" id="addPillBtn">+ افزودن تسک جدید</div>
  </div>
  <div class="add-form" id="addForm">
    <div class="add-row">
      <input type="text" class="emoji-input" id="emojiInput" value="✨">
      <input type="text" id="newTaskInput" placeholder="اسم تسک...">
      <button id="addBtn">افزودن</button>
    </div>
  </div>

  <div id="taskList"></div>

  <div class="footer-tag">
    <div class="brand">REIGN</div>
    <div class="credit">Discipline Focus — ساخته هومَن</div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src=""></div>

<div class="page-overlay" id="pageOverlay">
  <div class="page-top">
    <button class="page-back" id="pageBackBtn">→ بازگشت</button>
    <span class="page-brand">REIGN</span>
  </div>
  <div class="page-content" id="pageContent"></div>
</div>

<script>
const DEFAULT_TASKS = [
  {id:'wake', label:'سحرخیزی', emoji:'🌅'},
  {id:'exercise', label:'ورزش', emoji:'🏋️'},
  {id:'study', label:'مطالعه', emoji:'📖'},
  {id:'journal', label:'ژورنال‌نویسی', emoji:'📓'},
  {id:'hard', label:'انجام یک کار سخت', emoji:'🔥'},
];
const WEEKDAYS_FA = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const TICK_COUNT = 7;
const LOCK_MS = 20*60*60*1000;

function toJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365 * gy) + (Math.floor((gy2 + 3) / 4)) - (Math.floor((gy2 + 99) / 100)) + (Math.floor((gy2 + 399) / 400)) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * Math.floor(days / 12053);
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  let jm, jd;
  if (days < 186) { jm = 1 + Math.floor(days / 31); jd = 1 + (days % 31); }
  else { jm = 7 + Math.floor((days - 186) / 30); jd = 1 + ((days - 186) % 30); }
  return [jy, jm, jd];
}

let customTasks = [];
let ticksByTask = {};
let timesByTask = {};
let photoByTask = {};
let goals = {d30:'', d90:'', y1:''};
let taskGoals = {'daily-study':'', 'daily-finance':''};
let checklists = {'daily-study':[], 'daily-finance':[]};
let userName = '';
let weeksCompleted = 0; // stored, incremented when a full week (all tasks 7/7) is archived+reset

function allTasks(){ return [...DEFAULT_TASKS, ...customTasks]; }
function getTicks(id){ if(!ticksByTask[id]) ticksByTask[id] = new Array(TICK_COUNT).fill(false); return ticksByTask[id]; }
function getTimes(id){ if(!timesByTask[id]) timesByTask[id] = new Array(TICK_COUNT).fill(null); return timesByTask[id]; }
function nextIndexOf(ticks){ const idx = ticks.indexOf(false); return idx === -1 ? TICK_COUNT : idx; }

async function loadData(){
  try{
    const raw = localStorage.getItem('reign-state');
    if(raw){
      const p = JSON.parse(raw);
      customTasks = p.customTasks || [];
      ticksByTask = p.ticksByTask || {};
      timesByTask = p.timesByTask || {};
      photoByTask = p.photoByTask || {};
      goals = p.goals || goals;
      userName = p.userName || '';
      weeksCompleted = p.weeksCompleted || 0;
      taskGoals = p.taskGoals || taskGoals;
      checklists = p.checklists || checklists;
    }
  }catch(e){ /* fresh */ }
}
async function saveData(){
  try{
    localStorage.setItem('reign-state', JSON.stringify({customTasks, ticksByTask, timesByTask, photoByTask, goals, userName, weeksCompleted, taskGoals, checklists}));
  }catch(e){ console.error('ذخیره ناموفق', e); }
}

function renderHeader(){
  const d = new Date();
  const [jy,jm,jd] = toJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  document.getElementById('dateStatic').textContent = `${jd} ${JALALI_MONTHS[jm-1]} ${jy} — ${WEEKDAYS_FA[d.getDay()]}`;
  document.getElementById('nameInput').value = userName;
}

const GOAL_DEFS = [
  {key:'d30', tag:'۳۰ روزه'},
  {key:'d90', tag:'۹۰ روزه'},
  {key:'y1', tag:'یک ساله'},
];

function goalsModalHtml(){
  return `
    <div class="modal-title">هدف‌ها</div>
    ${GOAL_DEFS.map(g=>`
      <div class="goal-card" style="margin-bottom:10px;">
        <span class="goal-tag">${g.tag}</span>
        <textarea class="goal-text" data-key="${g.key}" rows="2" placeholder="هدف ${g.tag} چیه؟">${goals[g.key]||''}</textarea>
      </div>
    `).join('')}
  `;
}
function wireGoalsModal(){
  document.querySelectorAll('#pageContent .goal-text').forEach(el=>{
    el.addEventListener('input', ()=>{ goals[el.dataset.key]=el.value; saveData(); });
  });
}

function checklistPageHtml(storeKey, title, emoji, itemLabel){
  const items = getChecklist(storeKey);
  return `
    <div class="modal-title">${emoji} ${title}</div>
    <div class="goal-card" style="margin-bottom:16px;">
      <span class="goal-tag">هدف این تسک</span>
      <textarea class="goal-text" data-goalkey="${storeKey}" rows="2" placeholder="هدفت از ${title} چیه؟">${taskGoals[storeKey]||''}</textarea>
    </div>
    <div id="checklistItems">
      ${items.map(it=>checklistItemHtml(storeKey, it, itemLabel)).join('') || `<div style="color:var(--ink-faint); font-size:13px; padding:8px 2px;">هنوز چیزی اضافه نکردی</div>`}
    </div>
    <div class="add-row" style="margin-top:12px;">
      <input type="text" id="checklistInput" placeholder="مثلاً: ${itemLabel}">
      <button id="checklistAddBtn" data-checklist="${storeKey}">افزودن</button>
    </div>
  `;
}
function checklistItemHtml(storeKey, it, itemLabel){
  if(!it.ticks) it.ticks = new Array(TICK_COUNT).fill(false);
  if(!it.times) it.times = new Array(TICK_COUNT).fill(null);
  const checkedCount = it.ticks.filter(Boolean).length;
  const pct = Math.round((checkedCount/TICK_COUNT)*100);
  const nextIdx = nextIndexOf(it.ticks);
  let unlockAt = 0;
  if(nextIdx < TICK_COUNT){ unlockAt = nextIdx===0 ? 0 : (it.times[nextIdx-1]||0)+LOCK_MS; }
  const remaining = unlockAt - Date.now();

  const boxesHtml = it.ticks.map((on,i)=>{
    if(on){
      const undoable = (i === nextIdx-1);
      return `<div class="tick-box on ${undoable?'':'locked'}" data-checklist="${storeKey}" data-item="${it.id}" data-i="${i}" data-act="${undoable?'undo':'none'}">✓</div>`;
    }
    if(i === nextIdx && remaining<=0){
      return `<div class="tick-box next-open" data-checklist="${storeKey}" data-item="${it.id}" data-i="${i}" data-act="check">${i+1}</div>`;
    }
    if(i === nextIdx && remaining>0){
      return `<div class="tick-box waiting" data-checklist="${storeKey}" data-item="${it.id}" data-i="${i}" data-act="wait">⏳</div>`;
    }
    return `<div class="tick-box locked" data-checklist="${storeKey}" data-item="${it.id}" data-i="${i}" data-act="none">🔒</div>`;
  }).join('');

  return `
    <div class="task" style="padding:13px 14px; margin-bottom:10px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="flex:1; font-size:14px; font-weight:600;">${it.text}</div>
        <button class="icon-btn" data-checklist="${storeKey}" data-delitem="${it.id}">×</button>
      </div>
      <div class="tick-grid">${boxesHtml}</div>
      <div class="tick-footer">
        <div class="tick-count">${checkedCount} از ${TICK_COUNT} روز</div>
        <div class="pct-badge">${pct}٪</div>
      </div>
    </div>
  `;
}
function getChecklist(key){ if(!checklists[key]) checklists[key] = []; return checklists[key]; }
function refreshChecklistPage(storeKey, itemLabel){
  openPage(checklistPageHtml(storeKey, currentPageMeta.title, currentPageMeta.emoji, itemLabel));
  wireChecklistPage(storeKey, itemLabel);
}
function wireChecklistPage(storeKey, itemLabel){
  document.querySelectorAll('#pageContent .goal-text').forEach(el=>{
    el.addEventListener('input', ()=>{ taskGoals[el.dataset.goalkey]=el.value; saveData(); });
  });
  document.querySelectorAll('.tick-box[data-checklist]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const items = getChecklist(el.dataset.checklist);
      const it = items.find(i=>i.id===el.dataset.item);
      if(!it) return;
      const i = parseInt(el.dataset.i,10), act = el.dataset.act;
      if(act==='check'){ it.ticks[i]=true; it.times[i]=Date.now(); }
      else if(act==='undo'){ it.ticks[i]=false; it.times[i]=null; }
      else { el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),250); return; }
      saveData();
      refreshChecklistPage(storeKey, itemLabel);
    });
  });
  document.querySelectorAll('[data-delitem]').forEach(el=>{
    el.addEventListener('click', ()=>{
      checklists[el.dataset.checklist] = getChecklist(el.dataset.checklist).filter(i=>i.id!==el.dataset.delitem);
      saveData();
      refreshChecklistPage(storeKey, itemLabel);
    });
  });
  const addBtn = document.getElementById('checklistAddBtn');
  const input = document.getElementById('checklistInput');
  function doAdd(){
    const val = input.value.trim();
    if(!val) return;
    getChecklist(storeKey).push({id:'item-'+Date.now()+Math.floor(Math.random()*1000), text:val, ticks:new Array(TICK_COUNT).fill(false), times:new Array(TICK_COUNT).fill(null)});
    saveData();
    refreshChecklistPage(storeKey, itemLabel);
  }
  if(addBtn) addBtn.addEventListener('click', doAdd);
  if(input) input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doAdd(); });
}
let currentPageMeta = {};
function openChecklistPage(storeKey, title, emoji, itemLabel){
  currentPageMeta = {title, emoji};
  openPage(checklistPageHtml(storeKey, title, emoji, itemLabel));
  wireChecklistPage(storeKey, itemLabel);
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 420;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.55));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderTasks(){
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  const tasks = allTasks();

  tasks.forEach(t=>{
    const ticks = getTicks(t.id);
    const times = getTimes(t.id);
    const checkedCount = ticks.filter(Boolean).length;
    const pct = Math.round((checkedCount/TICK_COUNT)*100);
    const photo = photoByTask[t.id];
    const nextIdx = nextIndexOf(ticks);
    let unlockAt = 0;
    if(nextIdx < TICK_COUNT){ unlockAt = nextIdx===0 ? 0 : (times[nextIdx-1]||0)+LOCK_MS; }
    const now = Date.now();
    const remaining = unlockAt - now;

    const boxesHtml = ticks.map((on,i)=>{
      if(on){
        const undoable = (i === nextIdx-1);
        return `<div class="tick-box on ${undoable?'':'locked'}" data-id="${t.id}" data-i="${i}" data-action="${undoable?'undo':'none'}">✓</div>`;
      }
      if(i === nextIdx && remaining<=0){
        return `<div class="tick-box next-open" data-id="${t.id}" data-i="${i}" data-action="check">${i+1}</div>`;
      }
      if(i === nextIdx && remaining>0){
        return `<div class="tick-box waiting" data-id="${t.id}" data-i="${i}" data-action="wait">⏳</div>`;
      }
      return `<div class="tick-box locked" data-id="${t.id}" data-i="${i}" data-action="none">🔒</div>`;
    }).join('');

    const row = document.createElement('div');
    row.className = 'task';
    row.innerHTML = `
      <div class="task-head">
        <div class="emoji-btn" data-id="${t.id}" style="animation-delay:${(Math.random()*1.5).toFixed(2)}s">${t.emoji || '✨'}</div>
        ${t.spinner?'<span class="spin-dot" style="flex:0 0 auto;"></span>':''}
        <input class="task-label" data-id="${t.id}" value="${t.label}">
        <label>${photo?`<img class="photo-thumb" style="width:32px;height:32px;" src="${photo}" data-full="${photo}">`:'<span class="icon-btn">📷</span>'}
          <input type="file" accept="image/*" capture="environment" data-photoid="${t.id}" style="display:none">
        </label>
        ${t.custom ? `<button class="icon-btn del-btn" data-id="${t.id}">×</button>` : ''}
      </div>
      <div class="tick-grid">${boxesHtml}</div>
      ${remaining>0 ? `<div class="tick-wait">تا باز شدن روز بعد کمی مونده</div>` : ''}
      <div class="tick-footer">
        <div class="tick-count">${checkedCount} از ${TICK_COUNT} روز</div>
        <div class="pct-badge">${pct}٪</div>
      </div>
    `;
    list.appendChild(row);

    if(pct>=100){
      // archive completed week and reset for a fresh cycle
      weeksCompleted += 1;
      ticksByTask[t.id] = new Array(TICK_COUNT).fill(false);
      timesByTask[t.id] = new Array(TICK_COUNT).fill(null);
      saveData();
    }
  });

  wireTaskEvents();
}

function wireTaskEvents(){
  const list = document.getElementById('taskList');
  list.querySelectorAll('.tick-box').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.id, i = parseInt(el.dataset.i,10), action = el.dataset.action;
      const ticks = getTicks(id), times = getTimes(id);
      if(action==='check'){ ticks[i]=true; times[i]=Date.now(); }
      else if(action==='undo'){ ticks[i]=false; times[i]=null; }
      else { el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),250); return; }
      saveData(); renderTasks();
    });
  });
  list.querySelectorAll('.emoji-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const ne = prompt('یه ایموجی انتخاب کن:', el.textContent.trim());
      if(ne){ setTaskField(el.dataset.id,'emoji',ne.trim().slice(0,4)); saveData(); renderTasks(); }
    });
  });
  list.querySelectorAll('.task-label').forEach(el=>{
    el.addEventListener('change', ()=>{ setTaskField(el.dataset.id,'label',el.value); saveData(); });
  });
  list.querySelectorAll('.del-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.id;
      customTasks = customTasks.filter(t=>t.id!==id);
      delete ticksByTask[id]; delete timesByTask[id]; delete photoByTask[id];
      saveData(); renderTasks();
    });
  });
  list.querySelectorAll('input[type=file]').forEach(el=>{
    el.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await compressImage(file);
        photoByTask[el.dataset.photoid] = dataUrl;
        await saveData();
        renderTasks();
      }catch(err){ console.error('آپلود عکس ناموفق بود', err); }
    });
  });
  list.querySelectorAll('.photo-thumb').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.preventDefault();
      document.getElementById('lightboxImg').src = el.dataset.full;
      document.getElementById('lightbox').classList.add('open');
    });
  });
}

});

function setTaskField(id, field, value){
  let t = customTasks.find(x=>x.id===id);
  if(t){ t[field]=value; return; }
  const def = DEFAULT_TASKS.find(x=>x.id===id);
  if(def){ def[field]=value; }
}

}

function avgPctOfItems(items){
  if(items.length===0) return 0;
  const sum = items.reduce((acc,it)=>{
    const ticks = it.ticks || [];
    return acc + Math.round((ticks.filter(Boolean).length/TICK_COUNT)*100);
  },0);
  return Math.round(sum/items.length);
}
document.getElementById('statsBtn').addEventListener('click', ()=>{
  const tasks = allTasks();

  const sum = tasks.reduce((acc,t)=>{
    const ticks = getTicks(t.id);
    return acc + Math.round((ticks.filter(Boolean).length/TICK_COUNT)*100);
  }, 0);
  const avgPct = Math.round(sum/total);
  const studyItems = getChecklist('daily-study');
  const financeItems = getChecklist('daily-finance');
  openPage(`
    <div class="modal-title">آمار نظم</div>
